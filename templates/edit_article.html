{% extends 'base.html' %}

{% block extra_head %}<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>{% endblock %}

{% block content %}

<style>
    main, body {
        background: none;
    }

    main {
        color: black;
    }


        main a {
            color: black;
        }
</style>

<p class="back-link"><a href="{% url 'editor_cabinet' %}">← Кабінет редактора</a></p>
<h1>Редагувати статтю</h1>

{% if error_message %}
<div class="error">{{ error_message }}</div>
{% endif %}

<form method="POST" action="{% url 'edit_article' article.slug %}" enctype="multipart/form-data" class="editor-form">
    {% csrf_token %}
    {% include 'article_form_fields.html' %}
    <div class="form-actions">
        <button type="submit" class="btn">Зберегти</button>
        <a class="btn btn-secondary" href="{% url 'article' article.slug %}">Переглянути статтю</a>
    </div>
</form>

{%endblock %}
