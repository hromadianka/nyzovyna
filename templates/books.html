{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<h1>{% trans "Бібліотека" %}</h1>

<div class="articles-container">
    {% for book in books %}
    <div class="article-card">
        <a href="{% url 'book' book.slug %}" style="display: block; padding: 0; height: 231px" aria-label="{{ book.title }}">
            <div class="card-image"
                 style="background: url('{{ book.cover_url }}') no-repeat; background-size: cover; background-position: center">
            </div>
        </a>
        <div class="card-text">
            <h2><a href="{% url 'book' book.slug %}" style="text-decoration: none">{{ book.title }}</a></h2>
            {% if book.book_author %}<p>{{ book.book_author }}</p>{% endif %}
            <p>{{ book.summary }}</p>
        </div>
    </div>
    {% endfor %}
</div>

{% include 'pagination.html' %}

{% endblock %}
