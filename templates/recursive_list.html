{% for category in categories %}
<li>
    <details id="category-{{ category.slug }}">
        <summary>
            <span>{{ category.name_ua }} <span class="field-hint">({{ category.name_en }})</span></span>
            <a href="#" class="danger-link category-delete" onclick="confirmDeleteCategory(event, '{{ category.slug }}')">Видалити</a>
        </summary>
        <button type="button" onclick="toggleForm('{{ category.id }}')" class="link-button">+ Додати підкатегорію</button>
        <form id="form_{{ category.id }}" class="inline-form" method="POST" action="{% url 'create_category' %}" hidden>
            {% csrf_token %}
            <input type="hidden" name="parent_id" value="{{ category.id }}">
            <input type="text" name="name_ua" placeholder="Назва українською" aria-label="Назва українською" required>
            <input type="text" name="name_en" placeholder="Назва англійською" aria-label="Назва англійською" required>
            <button type="submit" class="btn">Створити</button>
        </form>
        {% if category.menu_children %}
        <ul class="toggle">
            {% include 'recursive_list.html' with categories=category.menu_children %}
        </ul>
        {% endif %}
    </details>
</li>
{% endfor %}
