{% extends 'base.html' %}
{% load i18n %}

{% block content %}

<style>
    main {
        background: none;
        color: black;
    }


        main a {
            color: black;
        }
</style>

<form class="form" method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <input type="text" name="login" placeholder="{% trans 'Логін' %}" class="form" required />
    <input type="password" name="password" placeholder="{% trans 'Пароль' %}" class="form" required />
    <button class="btn">{% trans "Увійти" %}</button>
</form>

{% if messages %}
{% for message in messages %}
<p style="color: red; margin-top: 20px">{{ message }}</p>
{% endfor %}
{% endif %}

{% endblock %}
